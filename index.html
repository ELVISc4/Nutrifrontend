<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Nutri - AI Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة تحويل الشات إلى PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            /* ثيم الإضاءة الساطعة */
            --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #f4fdf8 40%, #d1fae5 100%);
            --text-color: #0f172a;
            --sub-text: #475569;
            --btn-bg: #ffffff;
            --btn-border: #a7f3d0;
            --user-bg: #dcf8c6;
            --user-text: #111b21;
            --bot-bg: #ffffff;
            --bot-text: #111b21;
            --sugg-bg: rgba(255, 255, 255, 0.7);
            --sugg-hover: rgba(220, 248, 198, 0.9);
        }

        [data-theme="dark"] {
            /* ثيم الإضاءة الداكنة */
            --bg-gradient: radial-gradient(circle at center, #061c11 0%, #090a0f 60%, #050505 100%);
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --btn-bg: #0f172a;
            --btn-border: #166534;
            --user-bg: #005c4b;
            --user-text: #e9edef;
            --bot-bg: #202c33;
            --bot-text: #e9edef;
            --sugg-bg: rgba(32, 44, 51, 0.7);
            --sugg-hover: rgba(0, 92, 75, 0.8);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: all 0.3s ease;
        }

        .top-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            z-index: 10;
        }

        [dir="ltr"] .top-controls { flex-direction: row-reverse; }

        .control-btn {
            padding: 8px 16px;
            background: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .control-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        .header { text-align: center; padding: 50px 20px 10px; }
        .header h1 { margin: 0; font-size: 28px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .apple-icon { display: inline-block; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0) rotate(-15deg); opacity: 0; } 70% { transform: scale(1.2) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        .domain-selector { text-align: center; margin: 10px auto 20px; width: 90%; max-width: 600px; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 15px; outline: none; cursor: pointer; }

        .suggestions-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; min-height: 50px; transition: opacity 0.5s ease; }
        .suggestion-chip { background: var(--sugg-bg); border: 1px solid var(--btn-border); color: var(--text-color); padding: 10px 15px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .suggestion-chip:hover { background: var(--sugg-hover); transform: translateY(-2px); }

        .chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; border-top: 1px solid rgba(150, 150, 150, 0.1); }
        
        .message { padding: 15px 20px; border-radius: 18px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08); line-height: 1.6; animation: fadeIn 0.4s ease-out forwards; max-width: 85%; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }

        .user-message { background-color: var(--user-bg); color: var(--user-text); margin-inline-start: auto; border-bottom-right-radius: 4px; margin-bottom: 20px; }
        [dir="ltr"] .user-message { border-bottom-right-radius: 18px; border-bottom-left-radius: 4px; }
        
        /* تنسيق أفاتار نيوتري */
        .bot-wrapper { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 20px; }
        [dir="ltr"] .bot-wrapper { flex-direction: row; }
        .bot-avatar { font-size: 24px; animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; margin-bottom: 5px; }
        @keyframes bounceIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        .bot-message { background-color: var(--bot-bg); color: var(--bot-text); border-bottom-right-radius: 4px; margin: 0; flex: 1; }
        [dir="ltr"] .bot-message { border-bottom-left-radius: 4px; border-bottom-right-radius: 18px; }

        /* تنسيقات الماركدون (الخط العريض والقوائم) */
        .bot-message strong { color: #166534; }
        [data-theme="dark"] .bot-message strong { color: #4ade80; }

        .input-area { max-width: 800px; margin: 0 auto; width: 100%; padding: 20px; box-sizing: border-box; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 16px; outline: none; }
        button.action-btn { padding: 0 25px; height: 54px; background: #166534; color: white; border: none; border-radius: 12px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 16px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;}
        button.action-btn:hover { background: #14532d; }
        button.pdf-btn { background: #ef4444; padding: 0 15px; }
        button.pdf-btn:hover { background: #dc2626; }
        
        .loading { display: none; text-align: center; color: var(--sub-text); margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body data-theme="light">

    <div class="top-controls">
        <button class="control-btn" id="themeBtn" onclick="toggleTheme()">🌙 مظلم</button>
        <button class="control-btn" id="langBtn" onclick="toggleLang()">🌐 EN</button>
    </div>

    <div class="header">
        <h1><span class="apple-icon">🍏</span> Nutri - AI Advisor</h1>
        <p id="subHeader" style="color: var(--sub-text); font-size: 14px; margin-top: 5px;">مستشارك الذكي في التغذية وتكنولوجيا الأغذية</p>
    </div>

    <div class="domain-selector">
        <select id="domainSelect"></select>
    </div>

    <div class="suggestions-container" id="suggestionsBox"></div>

    <!-- سيتم حفظ هذا الجزء كـ PDF -->
    <div class="chat-container" id="chatContainer"></div>
    
    <div class="loading" id="loadingIndicator">Nutri يحلل البيانات ويصيغ الرد... ⏳</div>

    <div class="input-area">
        <button class="action-btn pdf-btn" id="pdfBtn" onclick="downloadPDF()" title="حفظ كمستند PDF">📥 PDF</button>
        <input type="text" id="userInput" placeholder="اسأل Nutri عن أي استشارة غذائية..." onkeypress="handleKeyPress(event)">
        <button class="action-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // === 1. إدارة التوطين (اللغات) الشاملة ===
        let currentLang = 'ar';
        const uiText = {
            ar: {
                themeLight: "☀️ ساطع", themeDark: "🌙 مظلم", langToggle: "🌐 EN",
                subHeader: "مستشارك الذكي في التغذية وتكنولوجيا الأغذية",
                domainDefault: "اختر مجال الاستشارة التخصصي...",
                inputPlaceholder: "اسأل Nutri عن أي استشارة غذائية...",
                sendBtn: "إرسال", loading: "Nutri يحلل البيانات ويصيغ الرد... ⏳",
                errorMsg: "عذراً، حدث خطأ في الاتصال بالخادم."
            },
            en: {
                themeLight: "☀️ Light", themeDark: "🌙 Dark", langToggle: "🌐 AR",
                subHeader: "Your Smart Advisor in Nutrition & Food Tech",
                domainDefault: "Select Consultation Domain...",
                inputPlaceholder: "Ask Nutri for dietary or tech advice...",
                sendBtn: "Send", loading: "Nutri is analyzing and formulating a reply... ⏳",
                errorMsg: "Sorry, a server connection error occurred."
            }
        };

        const domainsData = {
            ar: ["التغذية البشرية والأنظمة الغذائية", "استشارة عامة في الأغذية", "كيمياء وتحليل الأغذية", "سلامة وصحة الغذاء وتأمين الجودة", "هندسة وتصنيع خطوط الإنتاج", "تطوير المنتجات والابتكار الغذائي", "ميكروبيولوجيا والأحياء الدقيقة للأغذية"],
            en: ["Human Nutrition & Diets", "General Food Consultation", "Food Chemistry & Analysis", "Food Safety & Quality Assurance", "Engineering & Production Lines", "Product Development & Innovation", "Food Microbiology"]
        };

        function initDomains() {
            const select = document.getElementById('domainSelect');
            select.innerHTML = `<option value="">${uiText[currentLang].domainDefault}</option>`;
            domainsData[currentLang].forEach(d => {
                select.innerHTML += `<option value="${d}">${d}</option>`;
            });
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('langBtn').textContent = uiText[currentLang].langToggle;
            document.getElementById('subHeader').textContent = uiText[currentLang].subHeader;
            document.getElementById('userInput').placeholder = uiText[currentLang].inputPlaceholder;
            document.getElementById('sendBtn').textContent = uiText[currentLang].sendBtn;
            document.getElementById('loadingIndicator').textContent = uiText[currentLang].loading;
            
            updateThemeButtonText();
            initDomains(); // تحديث القائمة المنسدلة للغة الجديدة
            rotateSuggestions(); 
        }

        // === 2. إدارة الثيم (الألوان) ===
        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
            updateThemeButtonText();
        }

        function updateThemeButtonText() {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            document.getElementById('themeBtn').textContent = isLight ? uiText[currentLang].themeDark : uiText[currentLang].themeLight;
        }

        // === 3. نظام التدوير الذكي للاقتراحات ===
        const suggestionsPool = {
            ar: [
                "من أنت ومن قام بتطويرك؟", "كيف أقرأ البطاقة الغذائية بشكل صحيح؟", 
                "ما هي أفضل الأنظمة الغذائية لزيادة التركيز؟", "كيف نتحكم في تغيرات الألوان أثناء التصنيع؟",
                "ما هي معايير الـ HACCP في خطوط الإنتاج؟", "كيف نبتكر تركيبات غذائية جديدة؟"
            ],
            en: [
                "Who are you and who developed you?", "How to read Nutrition Facts correctly?",
                "Best diets for mental focus?", "How to control color changes during processing?",
                "What are HACCP standards in production lines?", "How to innovate new food formulations?"
            ]
        };

        function rotateSuggestions() {
            const pool = suggestionsPool[currentLang];
            const box = document.getElementById('suggestionsBox');
            let shuffled = pool.sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, 3);
            
            box.style.opacity = 0;
            setTimeout(() => {
                box.innerHTML = '';
                selected.forEach(sugg => {
                    let chip = document.createElement('div');
                    chip.className = 'suggestion-chip';
                    chip.textContent = sugg;
                    chip.onclick = () => { document.getElementById('userInput').value = sugg; sendMessage(); };
                    box.appendChild(chip);
                });
                box.style.opacity = 1;
            }, 500); 
        }
        setInterval(rotateSuggestions, 20000);

        // === 4. محرك الترجمة للماركدون (Markdown Parser) ===
        function parseMarkdown(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // تحويل **نص** إلى خط عريض
                .replace(/\*(.*?)\*/g, '<em>$1</em>') // تحويل *نص* إلى خط مائل
                .replace(/\n/g, '<br>'); // تحويل النزول لسطر جديد
        }

        // === 5. محرك الشات والاتصال ===
        function appendMessage(content, sender) {
            const chatContainer = document.getElementById('chatContainer');
            
            if (sender === 'user') {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message user-message';
                msgDiv.innerHTML = parseMarkdown(content);
                chatContainer.appendChild(msgDiv);
            } else {
                // تصميم الأفاتار الخاص بنيوتري
                const wrapper = document.createElement('div');
                wrapper.className = 'bot-wrapper';
                wrapper.innerHTML = `
                    <div class="bot-avatar">🍏</div>
                    <div class="message bot-message">${parseMarkdown(content)}</div>
                `;
                chatContainer.appendChild(wrapper);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            const selectedDomain = document.getElementById('domainSelect').value;
            appendMessage(message, 'user');
            inputField.value = '';
            document.getElementById('suggestionsBox').style.display = 'none';
            
            const loading = document.getElementById('loadingIndicator');
            loading.style.display = 'block';

            // تكتيك الحقن الخفي للحفاظ على نقاء اللغة
            let languageEnforcement = currentLang === 'en' 
                ? "\n[System Strict Rule: Reply ONLY in English. Do not use Arabic unless it is a specific technical food term.]" 
                : "\n[System Strict Rule: Reply ONLY in Arabic. Do not use English unless it is a specific technical food term.]";

            try {
                const response = await fetch('https://nutrimind-red.vercel.app/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_message: message + languageEnforcement, 
                        domain: selectedDomain 
                    })
                });

                if (!response.ok) throw new Error('Network Error');
                const data = await response.json();
                appendMessage(data.reply, 'bot');
            } catch (error) {
                appendMessage(uiText[currentLang].errorMsg, 'bot');
            } finally {
                loading.style.display = 'none';
            }
        }

        // === 6. محرك تصدير الـ PDF ===
        function downloadPDF() {
            const element = document.getElementById('chatContainer');
            
            // التأكد من وجود محادثة قبل الحفظ
            if (element.children.length === 0) {
                alert(currentLang === 'ar' ? "لا توجد محادثة لحفظها!" : "No chat to save!");
                return;
            }

            const opt = {
                margin:       10,
                filename:     'Nutri_Consultation.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            // إضافة كلاس مؤقت لضبط ألوان الـ PDF في وضع الـ Dark Theme
            element.style.backgroundColor = document.body.getAttribute('data-theme') === 'dark' ? '#061c11' : '#ffffff';
            
            html2pdf().set(opt).from(element).save().then(() => {
                element.style.backgroundColor = ''; // إعادة اللون لطبيعته
            });
        }

        // التشغيل الأولي
        initDomains();
        rotateSuggestions();
    </script>
</body>
</html>
