<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutri - AI Advisor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍏</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #f8fafc 0%, #edf2f9 100%);
            --text-color: #0f172a;
            --sub-text: #475569;
            --btn-bg: #ffffff;
            --btn-border: #cbd5e1;
            --user-bg: #dcf8c6;
            --user-text: #111b21;
            --bot-bg: #ffffff;
            --bot-text: #111b21;
            --sugg-bg: rgba(255, 255, 255, 0.8);
            --sidebar-bg: rgba(255, 255, 255, 0.95);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --highlight-color: #059669;
            --focus-glow: rgba(5, 150, 105, 0.15);
            --icon-color: #475569;
            --hover-item: rgba(15, 23, 42, 0.05);
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at center, #061c11 0%, #020617 100%);
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --btn-bg: rgba(15, 23, 42, 0.6);
            --btn-border: #166534;
            --user-bg: #005c4b;
            --user-text: #e9edef;
            --bot-bg: rgba(30, 41, 59, 0.7);
            --bot-text: #e9edef;
            --sugg-bg: rgba(30, 41, 59, 0.6);
            --sidebar-bg: rgba(15, 23, 42, 0.95);
            --glass-bg: rgba(15, 23, 42, 0.7);
            --highlight-color: #34d399;
            --focus-glow: rgba(52, 211, 153, 0.15);
            --icon-color: #94a3b8;
            --hover-item: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(150,150,150,0.6); }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-gradient); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: background 0.4s, color 0.4s; overflow-x: hidden;}

        .lucide { width: 18px; height: 18px; stroke-width: 2.2; }

        .top-controls { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: row; gap: 8px; z-index: 10; direction: ltr !important; background: var(--glass-bg); backdrop-filter: blur(12px); padding: 8px; border-radius: 12px; border: 1px solid var(--btn-border); box-shadow: 0 4px 6px rgba(0,0,0,0.02);}
        .control-btn { padding: 6px 12px; background: transparent; color: var(--text-color); border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: 'Cairo', sans-serif; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px;}
        .control-btn:hover { background: rgba(150,150,150,0.1); transform: translateY(-1px); }
        .delete-btn { color: #ef4444 !important; }
        .delete-btn .lucide { stroke: #ef4444; }
        html[dir="rtl"] .control-btn { direction: rtl; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); z-index: 999; opacity: 0; pointer-events: none; transition: 0.3s ease; }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar { position: fixed; top: 0; right: 0; left: auto; width: 280px; height: 100vh; background: var(--sidebar-bg); backdrop-filter: blur(20px); box-shadow: -5px 0 25px rgba(0,0,0,0.08); transform: translateX(110%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; display: flex; flex-direction: column; padding: 20px 15px 30px; box-sizing: border-box; border-left: 1px solid var(--btn-border);}
        [data-theme="dark"] .sidebar { box-shadow: -5px 0 25px rgba(0,0,0,0.6); }
        .sidebar.open { transform: translateX(0); }
        html[dir="ltr"] .sidebar { right: auto; left: 0; transform: translateX(-110%); border-left: none; border-right: 1px solid var(--btn-border);}
        html[dir="ltr"] .sidebar.open { transform: translateX(0); }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--btn-border); padding-bottom: 15px; padding-inline: 5px; flex-shrink: 0;}
        .close-sidebar { background: none; border: none; color: var(--text-color); cursor: pointer; transition: 0.2s; display: flex; align-items: center;}
        .close-sidebar:hover { transform: scale(1.1); color: #ef4444;}
        
        .new-chat-btn { width: calc(100% - 10px); margin: 0 5px 20px; padding: 12px; background: #166534; color: white; border: none; border-radius: 10px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .new-chat-btn:hover { background: #14532d; transform: translateY(-2px);}
        
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;}
        .history-item-wrapper { display: flex; align-items: center; justify-content: space-between; border-radius: 10px; padding: 4px; }
        .history-item-wrapper:hover { background: var(--hover-item); }
        .history-item { flex: 1; padding: 8px 6px; border: none; background: transparent; cursor: pointer; font-size: 14px; text-align: start; color: var(--text-color); display: flex; align-items: center; gap: 10px; font-weight: 600;}
        .delete-single-btn { background: none; border: none; color: var(--sub-text); cursor: pointer; padding: 6px; border-radius: 6px; opacity: 0.4; }
        .history-item-wrapper:hover .delete-single-btn { opacity: 1; }
        .delete-single-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); opacity: 1;}
        
        .sidebar-footer { margin-top: 15px; border-top: 1px solid var(--btn-border); padding-top: 15px; text-align: center; font-size: 12px; color: var(--sub-text); line-height: 1.6;}
        .sidebar-footer a { color: var(--highlight-color); text-decoration: none; font-weight: bold; }

        /* الشاشة البيضاء انتهت: تم تحديد العرض بشكل سليم لتظهر الواجهة دائماً */
        #app-content { display: flex; height: 100%; flex-direction: column; width: 100%; } 

        .header { text-align: center; padding: 25px 20px 5px; z-index: 5; }
        .header h1 { margin: 0; font-size: 24px; display: flex; justify-content: center; align-items: center; gap: 8px; font-weight: 800;}

        .domain-selector { text-align: center; margin: 0 auto 10px; width: 90%; max-width: 400px; z-index: 5; }
        select { width: 100%; padding: 10px 15px; border-radius: 10px; border: 1px solid var(--btn-border); background: var(--glass-bg); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 14px; outline: none; cursor: pointer;}
        select:focus { border-color: var(--highlight-color); }

        .chat-container { flex: 1; overflow-y: auto; padding: 20px 20px 40px; max-width: 850px; margin: 0 auto; width: 100%; position: relative; scroll-behavior: smooth; }
        
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .empty-state h2 { color: var(--text-color); margin-bottom: 5px; font-weight: 800; font-size: 28px;}
        .empty-state p { color: var(--sub-text); margin-top: 0; margin-bottom: 35px; font-size: 15px;}
        .suggestions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; width: 100%; max-width: 650px; }
        .suggestion-card { background: var(--sugg-bg); border: 1px solid var(--btn-border); color: var(--text-color); padding: 16px; border-radius: 14px; font-size: 14px; cursor: pointer; display: flex; align-items: flex-start; gap: 10px; transition: 0.3s;}
        .suggestion-card:hover { transform: translateY(-4px); border-color: var(--highlight-color);}
        
        .message-wrapper { display: flex; flex-direction: column; position: relative; margin-bottom: 30px; width: 100%; }
        .user-wrapper { align-items: flex-start; } html[dir="ltr"] .user-wrapper { align-items: flex-end; }
        .bot-wrapper-content { display: flex; align-items: flex-end; gap: 12px; justify-content: flex-start; width: 100%; }
        
        .message { padding: 16px 22px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); line-height: 1.75; max-width: 85%; text-align: start; font-size: 15px;}
        .user-message { background-color: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 6px; }
        html[dir="ltr"] .user-message { border-bottom-right-radius: 20px; border-bottom-left-radius: 6px; }
        .bot-avatar { font-size: 26px; margin-bottom: 6px;}
        .bot-message { background: var(--bot-bg); color: var(--bot-text); border-bottom-right-radius: 6px; margin: 0; flex: 1; border: 1px solid var(--btn-border); }
        html[dir="ltr"] .bot-message { border-bottom-left-radius: 6px; border-bottom-right-radius: 20px; }
        
        .timestamp { font-size: 11px; color: var(--sub-text); margin-top: 6px; opacity: 0.7; padding: 0 8px; font-weight: 600;}
        .user-wrapper .timestamp { align-self: flex-start; } html[dir="ltr"] .user-wrapper .timestamp { align-self: flex-end; }
        .bot-wrapper .timestamp { padding-inline-start: 50px; }

        .input-area { max-width: 800px; margin: 0 auto; width: 100%; padding: 10px 20px 20px; display: flex; gap: 12px; align-items: center; background: transparent; }
        input[type="text"] { flex: 1; padding: 16px 20px; border-radius: 14px; border: 1px solid var(--btn-border); background: var(--glass-bg); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 15px; outline: none; transition: 0.3s;}
        input[type="text"]:focus { border-color: var(--highlight-color); }
        
        button.action-btn { padding: 0 24px; height: 56px; background: #166534; color: white; border: none; border-radius: 14px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.6; pointer-events: none;}
        button.action-btn.active { opacity: 1; pointer-events: auto; }
        button.action-btn.active:hover { background: #14532d; transform: translateY(-2px);}
        
        .mic-btn { padding: 0; width: 56px; height: 56px; background: var(--btn-bg); color: var(--text-color); border: 1px solid var(--btn-border); border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;}
        .mic-btn:hover { background: rgba(150,150,150,0.1); }
        button.pdf-btn { background: #ef4444; width: 56px; opacity: 1; pointer-events: auto; padding: 0; }
        
        .disclaimer { text-align: center; font-size: 11px; color: var(--sub-text); padding: 0 20px 15px; opacity: 0.7;}

        .typing-indicator { display: none; align-items: center; gap: 6px; padding: 15px 22px; background: var(--bot-bg); border-radius: 20px; border-bottom-right-radius: 6px; margin-inline-start: 48px; border: 1px solid var(--btn-border); width: fit-content; margin-bottom: 20px;}
        .dot { width: 8px; height: 8px; background-color: var(--highlight-color); border-radius: 50%; animation: pulse 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; } .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0.4); opacity: 0.5;} 40% { transform: scale(1); opacity: 1;} }

        @media (max-width: 768px) {
            .input-area { padding: 10px 15px 20px; gap: 8px;} 
            .action-btn, .mic-btn, .pdf-btn { width: 48px !important; min-width: 48px !important; height: 48px !important; padding: 0 !important; }
            .action-btn span { display: none !important; } 
            .header { padding-top: 70px; }
            .header h1 { font-size: 22px; }
            .apple-float { font-size: 75px; }
        }
    </style>
</head>
<body data-theme="light">

    <div id="app-content">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 id="historyTitle" style="margin:0; font-size: 18px; font-weight: 800;">سجل المحادثات</h3>
                <button class="close-sidebar" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()"><i data-lucide="plus"></i> <span id="newChatText">محادثة جديدة</span></button>
            <div class="history-list" id="historyList"></div>
            
            <div class="sidebar-footer">
                <div id="supportText">للتواصل والدعم:</div>
                <a href="mailto:hazemelhelw2020@gmail.com">hazemelhelw2020@gmail.com</a>
                <div style="margin-top: 10px; opacity: 0.8;" id="creditText">Designed & Developed by<br>Hazem El Helw</div>
            </div>
        </div>

        <div class="top-controls">
            <button class="control-btn" onclick="toggleSidebar()"><i data-lucide="history"></i> <span id="menuText">السجل</span></button>
            <button class="control-btn" id="themeBtn" onclick="toggleTheme()"><i data-lucide="moon"></i> مظلم</button>
            <button class="control-btn" id="langBtn" onclick="toggleLang()"><i data-lucide="globe"></i> EN</button>
            <button class="control-btn delete-btn" onclick="clearAllChats()"><i data-lucide="trash-2"></i></button>
        </div>

        <div class="header">
            <h1><span style="font-size: 28px;">🍏</span> Nutri - AI Advisor</h1>
        </div>

        <div class="domain-selector">
            <select id="domainSelect"></select>
        </div>

        <div class="chat-container" id="chatContainer">
            <div id="messagesArea"></div>
            <div class="typing-indicator" id="loadingIndicator">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <button class="action-btn pdf-btn" onclick="exportToPDF()" title="حفظ كمستند PDF"><i data-lucide="download"></i></button>
            <button class="mic-btn" id="micBtn" onclick="toggleVoiceRecord()" title="إدخال صوتي"><i data-lucide="mic"></i></button>
            <input type="text" id="userInput" placeholder="اسأل Nutri عن أي استشارة غذائية..." onkeypress="handleKeyPress(event)" oninput="toggleSendButton()">
            <button class="action-btn" id="sendBtn" onclick="sendMessage()"><i data-lucide="send"></i> <span id="sendText">إرسال</span></button>
        </div>
        <div class="disclaimer" id="disclaimerText">Nutri هو نموذج ذكاء اصطناعي، وقد يعرض معلومات غير دقيقة.</div>
    </div>

    <script>
        // المتغيرات الأساسية (تعمل فوراً بدون شروط)
        let currentLang = localStorage.getItem('nutri_lang') || 'ar';
        let currentChatId = null; 
        let currentChatMessages = [];
        
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.body.setAttribute('data-theme', localStorage.getItem('nutri_theme') || 'light');

        const domainsData = {
            ar: ["التغذية البشرية والأنظمة الغذائية", "استشارة عامة في الأغذية", "كيمياء وتحليل الأغذية", "سلامة وصحة الغذاء وتأمين الجودة", "هندسة وتصنيع خطوط الإنتاج", "تطوير المنتجات والابتكار الغذائي", "ميكروبيولوجيا والأحياء الدقيقة للأغذية"],
            en: ["Human Nutrition & Diets", "General Food Consultation", "Food Chemistry & Analysis", "Food Safety & Quality Assurance", "Engineering & Production Lines", "Product Development & Innovation", "Food Microbiology"]
        };

        const uiText = {
            ar: { welcomeTitle: "كيف يمكنني مساعدتك اليوم؟", inputPlaceholder: "تحدث أو اكتب استشارتك الغذائية...", sendBtn: "إرسال", menuText: "السجل", historyTitle: "سجل المحادثات", newChatBtn: "محادثة جديدة", domainDefault: "اختر مجال الاستشارة التخصصي (اختياري)...", themeLight: "ساطع", themeDark: "مظلم", langToggle: "EN", disclaimer: "Nutri هو نموذج ذكاء اصطناعي، وقد يعرض معلومات غير دقيقة." },
            en: { welcomeTitle: "How can I assist you today?", inputPlaceholder: "Speak or type your dietary advice...", sendBtn: "Send", menuText: "History", historyTitle: "Chat History", newChatBtn: "New Chat", domainDefault: "Select Consultation Domain (Optional)...", themeLight: "Light", themeDark: "Dark", langToggle: "AR", disclaimer: "Nutri is an AI model and may present inaccurate information." }
        };

        const suggestionsPool = {
            ar: [ {icon: "info", text: "كيف أقرأ البطاقة الغذائية بشكل صحيح؟"}, {icon: "shield-check", text: "أفضل طرق حفظ الأطعمة في الثلاجة؟"}, {icon: "flame", text: "طريقة صحية لقلي الطعام بأقل ضرر؟"}, {icon: "apple", text: "كيف أغسل الخضروات والفواكه بطريقة علمية؟"} ],
            en: [ {icon: "info", text: "How to read Nutrition Facts correctly?"}, {icon: "shield-check", text: "Best ways to store food in the fridge?"}, {icon: "flame", text: "Healthier ways to fry food?"}, {icon: "apple", text: "How to scientifically wash vegetables?"} ]
        };

        // الدالة الرئيسية: تعمل فوراً لترسم الواجهة ولا تنتظر أي شيء
        document.addEventListener("DOMContentLoaded", () => {
            initDomains();
            updateUI();
            renderCurrentChat();
            renderHistoryList();
            try { lucide.createIcons(); } catch(e) { console.error("Lucide failed", e); }
        });

        function getGreeting() {
            const hour = new Date().getHours();
            if (currentLang === 'ar') return hour < 12 ? "صباح الخير" : "مساء الخير";
            return hour < 12 ? "Good Morning" : (hour < 18 ? "Good Afternoon" : "Good Evening");
        }

        function initDomains() {
            const select = document.getElementById('domainSelect');
            select.innerHTML = `<option value="">${uiText[currentLang].domainDefault}</option>`;
            domainsData[currentLang].forEach(d => { select.innerHTML += `<option value="${d}">${d}</option>`; });
        }

        function updateUI() {
            document.getElementById('langBtn').innerHTML = `<i data-lucide="globe"></i> ${uiText[currentLang].langToggle}`;
            document.getElementById('menuText').textContent = uiText[currentLang].menuText;
            document.getElementById('historyTitle').textContent = uiText[currentLang].historyTitle;
            document.getElementById('newChatText').textContent = uiText[currentLang].newChatBtn;
            document.getElementById('userInput').placeholder = uiText[currentLang].inputPlaceholder;
            document.getElementById('sendText').textContent = uiText[currentLang].sendBtn;
            document.getElementById('disclaimerText').textContent = uiText[currentLang].disclaimer;
            
            const isLight = document.body.getAttribute('data-theme') === 'light';
            document.getElementById('themeBtn').innerHTML = isLight ? `<i data-lucide="moon"></i> ${uiText[currentLang].themeDark}` : `<i data-lucide="sun"></i> ${uiText[currentLang].themeLight}`;
            try { lucide.createIcons(); } catch(e){}
        }

        function toggleTheme() {
            const newTheme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('nutri_theme', newTheme); updateUI();
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('nutri_lang', currentLang);
            location.reload();
        }

        function toggleSendButton() {
            const inputField = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            if(inputField.value.trim().length > 0) { sendBtn.classList.add('active'); } 
            else { sendBtn.classList.remove('active'); }
        }

        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('open'); 
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function startNewChat() {
            currentChatId = Date.now().toString(); currentChatMessages = [];
            renderCurrentChat(); 
            if(window.innerWidth <= 768) toggleSidebar(); 
        }

        function renderEmptyState() {
            let cardsHtml = '';
            suggestionsPool[currentLang].forEach(sugg => {
                cardsHtml += `
                <div class="suggestion-card" onclick="document.getElementById('userInput').value = '${sugg.text}'; toggleSendButton(); sendMessage();">
                    <i data-lucide="${sugg.icon}"></i> <span>${sugg.text}</span>
                </div>`;
            });
            return `
                <div class="empty-state">
                    <div style="font-size: 80px; margin-bottom:10px;">🍏</div>
                    <h2>${getGreeting()}</h2>
                    <p>${uiText[currentLang].welcomeTitle}</p>
                    <div class="suggestions-grid">${cardsHtml}</div>
                </div>`;
        }

        function renderCurrentChat() {
            const msgArea = document.getElementById('messagesArea');
            if (currentChatMessages.length === 0) {
                msgArea.innerHTML = renderEmptyState(); 
                try { lucide.createIcons(); } catch(e){}
                return;
            }
            
            msgArea.innerHTML = '';
            currentChatMessages.forEach((msg) => {
                const isUser = msg.role === 'user';
                msgArea.innerHTML += `
                    <div class="message-wrapper ${isUser ? 'user-wrapper' : 'bot-wrapper'}">
                        <div class="${isUser ? '' : 'bot-wrapper-content'}">
                            ${isUser ? '' : '<div class="bot-avatar">🍏</div>'}
                            <div class="message ${isUser ? 'user-message' : 'bot-message'}" dir="auto">${msg.content}</div>
                        </div>
                        <div class="timestamp">${msg.time || ''}</div>
                    </div>`;
            });
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
        }

        // الاتصال الآمن بالسيرفر (لا يوقف الواجهة أبداً)
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            if (!currentChatId) currentChatId = Date.now().toString();
            const timeNow = new Date().toLocaleTimeString(currentLang === 'ar' ? 'ar-EG' : 'en-US', { hour: '2-digit', minute: '2-digit' });
            
            currentChatMessages.push({ role: 'user', content: message, time: timeNow });
            renderCurrentChat();
            
            inputField.value = ''; toggleSendButton(); 
            document.getElementById('loadingIndicator').style.display = 'flex'; 
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;

            const selectedDomain = document.getElementById('domainSelect').value;
            const chatHistory = currentChatMessages.slice(0, -1).slice(-4);
            saveChatToLocal(); 

            try {
                const response = await fetch('https://nutrimind-red.vercel.app/api/chat', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_message: message, domain: selectedDomain, history: chatHistory })
                });

                if (!response.ok) throw new Error('Network Error');
                const data = await response.json();
                
                currentChatMessages.push({ role: 'bot', content: data.reply, time: timeNow });
            } catch (error) {
                currentChatMessages.push({ role: 'bot', content: "عذراً، حدث خطأ في الاتصال بالخادم. يرجى المحاولة لاحقاً.", time: timeNow });
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none'; 
                renderCurrentChat(); 
                saveChatToLocal(); 
            }
        }

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        function saveChatToLocal() {
            if (currentChatMessages.length === 0) return;
            let chats = JSON.parse(localStorage.getItem('nutri_chats')) || {};
            let title = chats[currentChatId]?.title || currentChatMessages[0].content.split(' ').slice(0, 4).join(' ') + '...';
            chats[currentChatId] = { title: title, messages: currentChatMessages, date: new Date().toLocaleDateString() };
            localStorage.setItem('nutri_chats', JSON.stringify(chats)); 
            renderHistoryList();
        }

        function renderHistoryList() {
            const list = document.getElementById('historyList'); list.innerHTML = '';
            let chats = JSON.parse(localStorage.getItem('nutri_chats')) || {};
            Object.keys(chats).reverse().forEach(id => {
                list.innerHTML += `
                    <div class="history-item-wrapper">
                        <button class="history-item" onclick="loadChat('${id}'); toggleSidebar();">
                            <span>${chats[id].title}</span>
                        </button>
                    </div>`;
            });
        }

        function loadChat(id) {
            let chats = JSON.parse(localStorage.getItem('nutri_chats')) || {};
            if (chats[id]) {
                currentChatId = id; currentChatMessages = chats[id].messages;
                renderCurrentChat(); 
            }
        }

        function clearAllChats() {
            if(confirm(currentLang === 'ar' ? 'هل أنت متأكد من مسح كافة المحادثات؟' : 'Are you sure you want to clear all chats?')) {
                localStorage.removeItem('nutri_chats');
                currentChatId = Date.now().toString(); currentChatMessages = [];
                renderHistoryList(); renderCurrentChat();
            }
        }
    </script>
</body>
</html>
