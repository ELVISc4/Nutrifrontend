<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Nutri - AI Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #f4fdf8 40%, #d1fae5 100%);
            --text-color: #0f172a;
            --sub-text: #475569;
            --btn-bg: #ffffff;
            --btn-border: #a7f3d0;
            --user-bg: #dcf8c6;
            --user-text: #111b21;
            --bot-bg: #ffffff;
            --bot-text: #111b21;
            --sugg-bg: rgba(255, 255, 255, 0.7);
            --sugg-hover: rgba(220, 248, 198, 0.9);
            --sidebar-bg: #ffffff;
            --sidebar-shadow: -2px 0 10px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at center, #061c11 0%, #090a0f 60%, #050505 100%);
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --btn-bg: #0f172a;
            --btn-border: #166534;
            --user-bg: #005c4b;
            --user-text: #e9edef;
            --bot-bg: #202c33;
            --bot-text: #e9edef;
            --sugg-bg: rgba(32, 44, 51, 0.7);
            --sugg-hover: rgba(0, 92, 75, 0.8);
            --sidebar-bg: #0f172a;
            --sidebar-shadow: -2px 0 10px rgba(0,0,0,0.5);
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-gradient); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; transition: all 0.3s ease; overflow: hidden; }

        /* --- أدوات التحكم العلوية --- */
        .top-controls { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: flex-start; gap: 10px; z-index: 10; }
        [dir="ltr"] .top-controls { flex-direction: row-reverse; }
        .control-btn { padding: 8px 16px; background: var(--btn-bg); color: var(--text-color); border: 1px solid var(--btn-border); border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo', sans-serif; transition: 0.2s; }
        .control-btn:hover { transform: translateY(-2px); }

        /* --- الشباك الجانبي (Sidebar) لسجل المحادثات --- */
        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100vh; background: var(--sidebar-bg); box-shadow: var(--sidebar-shadow); transition: right 0.3s ease; z-index: 1000; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .sidebar.open { right: 0; }
        [dir="ltr"] .sidebar { left: -300px; right: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); transition: left 0.3s ease; }
        [dir="ltr"] .sidebar.open { left: 0; right: auto; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--btn-border); padding-bottom: 10px; }
        .close-sidebar { background: none; border: none; color: var(--text-color); font-size: 20px; cursor: pointer; }
        .new-chat-btn { width: 100%; padding: 10px; background: #166534; color: white; border: none; border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .new-chat-btn:hover { background: #14532d; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .history-item { padding: 10px; background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
        .history-item:hover { border-color: #166534; }

        /* --- الهيدر الأساسي --- */
        .header { text-align: center; padding: 50px 20px 10px; }
        .header h1 { margin: 0; font-size: 28px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .apple-icon { display: inline-block; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0) rotate(-15deg); opacity: 0; } 70% { transform: scale(1.2) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }

        .domain-selector { text-align: center; margin: 10px auto 20px; width: 90%; max-width: 600px; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 15px; outline: none; }

        .suggestions-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 10px; min-height: 50px; transition: 0.5s ease; }
        .suggestion-chip { background: var(--sugg-bg); border: 1px solid var(--btn-border); color: var(--text-color); padding: 8px 15px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .suggestion-chip:hover { background: var(--sugg-hover); transform: translateY(-2px); }

        /* --- منطقة الشات --- */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; border-top: 1px solid rgba(150, 150, 150, 0.1); }
        .message { padding: 15px 20px; border-radius: 18px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08); line-height: 1.6; max-width: 85%; animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }

        .user-message { background-color: var(--user-bg); color: var(--user-text); margin-inline-start: auto; border-bottom-right-radius: 4px; margin-bottom: 20px; }
        [dir="ltr"] .user-message { border-bottom-right-radius: 18px; border-bottom-left-radius: 4px; }
        
        .bot-wrapper { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 20px; }
        [dir="ltr"] .bot-wrapper { flex-direction: row; }
        .bot-avatar { font-size: 24px; animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; margin-bottom: 5px; }
        @keyframes bounceIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        .bot-message { background-color: var(--bot-bg); color: var(--bot-text); border-bottom-right-radius: 4px; margin: 0; flex: 1; }
        [dir="ltr"] .bot-message { border-bottom-left-radius: 4px; border-bottom-right-radius: 18px; }
        .bot-message strong { color: #166534; }
        [data-theme="dark"] .bot-message strong { color: #4ade80; }

        /* --- خدعة إصلاح جودة الـ PDF --- */
        .pdf-export-mode { background: #ffffff !important; padding: 20px !important; }
        .pdf-export-mode .message { box-shadow: none !important; border: 1px solid #ddd !important; background-color: #f8f9fa !important; color: #000000 !important; }
        .pdf-export-mode .bot-message strong { color: #000000 !important; font-weight: 900 !important; }

        /* --- منطقة الإدخال والتوقيع --- */
        .input-area { max-width: 800px; margin: 0 auto; width: 100%; padding: 15px 20px; box-sizing: border-box; display: flex; gap: 10px; align-items: center; z-index: 5; }
        input[type="text"] { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 16px; outline: none; }
        button.action-btn { padding: 0 20px; height: 54px; background: #166534; color: white; border: none; border-radius: 12px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 16px; transition: 0.2s; }
        button.action-btn:hover { background: #14532d; }
        button.pdf-btn { background: #ef4444; padding: 0 15px; }
        
        .loading { display: none; text-align: center; color: var(--sub-text); margin-bottom: 10px; font-weight: bold; }

        /* توقيع المطور */
        .developer-credit { text-align: center; font-size: 12px; color: var(--sub-text); padding-bottom: 10px; opacity: 0.8; font-weight: 600; }
    </style>
</head>
<body data-theme="light">

    <!-- الشباك الجانبي للمحادثات السابقة -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 id="historyTitle" style="margin:0; font-size: 18px;">سجل المحادثات</h3>
            <button class="close-sidebar" onclick="toggleSidebar()">✖</button>
        </div>
        <button class="new-chat-btn" id="newChatBtn" onclick="startNewChat()">+ محادثة جديدة</button>
        <div class="history-list" id="historyList">
            <!-- سيتم تحميل المحادثات هنا برمجياً -->
        </div>
    </div>

    <div class="top-controls">
        <button class="control-btn" onclick="toggleSidebar()">☰ <span id="menuText">السجل</span></button>
        <button class="control-btn" id="themeBtn" onclick="toggleTheme()">🌙 مظلم</button>
        <button class="control-btn" id="langBtn" onclick="toggleLang()">🌐 EN</button>
    </div>

    <div class="header">
        <h1><span class="apple-icon">🍏</span> Nutri - AI Advisor</h1>
        <p id="subHeader" style="color: var(--sub-text); font-size: 14px; margin-top: 5px;">مستشارك الذكي في التغذية وتكنولوجيا الأغذية</p>
    </div>

    <div class="domain-selector">
        <select id="domainSelect"></select>
    </div>

    <div class="suggestions-container" id="suggestionsBox"></div>

    <div class="chat-container" id="chatContainer"></div>
    
    <div class="loading" id="loadingIndicator">Nutri يحلل البيانات ويصيغ الرد... ⏳</div>

    <div class="input-area">
        <button class="action-btn pdf-btn" id="pdfBtn" onclick="downloadPDF()" title="حفظ كمستند PDF">📥 PDF</button>
        <input type="text" id="userInput" placeholder="اسأل Nutri عن أي استشارة غذائية..." onkeypress="handleKeyPress(event)">
        <button class="action-btn" id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>

    <!-- التوقيع الاحترافي -->
    <div class="developer-credit" id="devCredit">
        تم التطوير بواسطة حازم الحلو
    </div>

    <script>
        // === 1. إدارة التوطين (اللغات) الشاملة ===
        let currentLang = 'ar';
        const uiText = {
            ar: {
                themeLight: "☀️ ساطع", themeDark: "🌙 مظلم", langToggle: "🌐 EN", menuText: "السجل", historyTitle: "سجل المحادثات", newChatBtn: "+ محادثة جديدة",
                subHeader: "مستشارك الذكي في التغذية وتكنولوجيا الأغذية", domainDefault: "اختر مجال الاستشارة التخصصي...",
                inputPlaceholder: "اسأل Nutri عن أي استشارة غذائية...", sendBtn: "إرسال", loading: "Nutri يحلل البيانات ويصيغ الرد... ⏳",
                credit: "تم التطوير بواسطة حازم الحلو", errorMsg: "عذراً، حدث خطأ في الاتصال بالخادم."
            },
            en: {
                themeLight: "☀️ Light", themeDark: "🌙 Dark", langToggle: "🌐 AR", menuText: "History", historyTitle: "Chat History", newChatBtn: "+ New Chat",
                subHeader: "Your Smart Advisor in Nutrition & Food Tech", domainDefault: "Select Consultation Domain...",
                inputPlaceholder: "Ask Nutri for dietary or tech advice...", sendBtn: "Send", loading: "Nutri is analyzing and formulating a reply... ⏳",
                credit: "Developed by Hazem El Helw", errorMsg: "Sorry, a server connection error occurred."
            }
        };

        const domainsData = {
            ar: ["التغذية البشرية والأنظمة الغذائية", "استشارة عامة في الأغذية", "كيمياء وتحليل الأغذية", "سلامة وصحة الغذاء وتأمين الجودة", "هندسة وتصنيع خطوط الإنتاج", "تطوير المنتجات والابتكار الغذائي", "ميكروبيولوجيا والأحياء الدقيقة للأغذية"],
            en: ["Human Nutrition & Diets", "General Food Consultation", "Food Chemistry & Analysis", "Food Safety & Quality Assurance", "Engineering & Production Lines", "Product Development & Innovation", "Food Microbiology"]
        };

        function initDomains() {
            const select = document.getElementById('domainSelect');
            select.innerHTML = `<option value="">${uiText[currentLang].domainDefault}</option>`;
            domainsData[currentLang].forEach(d => { select.innerHTML += `<option value="${d}">${d}</option>`; });
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('langBtn').textContent = uiText[currentLang].langToggle;
            document.getElementById('menuText').textContent = uiText[currentLang].menuText;
            document.getElementById('historyTitle').textContent = uiText[currentLang].historyTitle;
            document.getElementById('newChatBtn').textContent = uiText[currentLang].newChatBtn;
            document.getElementById('subHeader').textContent = uiText[currentLang].subHeader;
            document.getElementById('userInput').placeholder = uiText[currentLang].inputPlaceholder;
            document.getElementById('sendBtn').textContent = uiText[currentLang].sendBtn;
            document.getElementById('loadingIndicator').textContent = uiText[currentLang].loading;
            document.getElementById('devCredit').textContent = uiText[currentLang].credit;
            
            updateThemeButtonText(); initDomains(); rotateSuggestions();
        }

        // === 2. الثيم والاقتراحات ===
        function toggleTheme() {
            document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
            updateThemeButtonText();
        }
        function updateThemeButtonText() {
            document.getElementById('themeBtn').textContent = document.body.getAttribute('data-theme') === 'light' ? uiText[currentLang].themeDark : uiText[currentLang].themeLight;
        }

        const suggestionsPool = {
            ar: ["من أنت ومن قام بتطويرك؟", "كيف أقرأ البطاقة الغذائية بشكل صحيح؟", "ما هي معايير الـ HACCP؟", "كيف نبتكر تركيبات غذائية جديدة؟"],
            en: ["Who are you and who developed you?", "How to read Nutrition Facts correctly?", "What are HACCP standards?", "How to innovate new food formulations?"]
        };
        function rotateSuggestions() {
            const box = document.getElementById('suggestionsBox');
            if(currentChatMessages.length > 0) { box.style.display = 'none'; return; }
            box.style.display = 'flex';
            let shuffled = suggestionsPool[currentLang].sort(() => 0.5 - Math.random()).slice(0, 3);
            box.style.opacity = 0;
            setTimeout(() => {
                box.innerHTML = '';
                shuffled.forEach(sugg => {
                    let chip = document.createElement('div');
                    chip.className = 'suggestion-chip'; chip.textContent = sugg;
                    chip.onclick = () => { document.getElementById('userInput').value = sugg; sendMessage(); };
                    box.appendChild(chip);
                });
                box.style.opacity = 1;
            }, 500); 
        }
        setInterval(rotateSuggestions, 20000);

        function parseMarkdown(text) { return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>'); }

        // === 3. نظام الذاكرة المحلية (Local Storage Database) ===
        let currentChatId = null;
        let currentChatMessages = [];

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function startNewChat() {
            currentChatId = Date.now().toString();
            currentChatMessages = [];
            document.getElementById('chatContainer').innerHTML = '';
            document.getElementById('suggestionsBox').style.display = 'flex';
            toggleSidebar();
            rotateSuggestions();
        }

        function saveChatToLocal() {
            if (currentChatMessages.length === 0) return;
            let chats = JSON.parse(localStorage.getItem('nutri_chats')) || {};
            // تعيين عنوان للمحادثة من أول رسالة للمستخدم
            let title = currentChatMessages[0].content.substring(0, 25) + "...";
            chats[currentChatId] = { title: title, messages: currentChatMessages, date: new Date().toLocaleDateString() };
            localStorage.setItem('nutri_chats', JSON.stringify(chats));
            renderHistoryList();
        }

        function renderHistoryList() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            let chats = JSON.parse(localStorage.getItem('nutri_chats')) || {};
            Object.keys(chats).reverse().forEach(id => {
                let div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = `${chats[id].date} | ${chats[id].title}`;
                div.onclick = () => loadChat(id);
                list.appendChild(div);
            });
        }

        function loadChat(id) {
            let chats = JSON.parse(localStorage.getItem('nutri_chats')) || {};
            if (chats[id]) {
                currentChatId = id;
                currentChatMessages = chats[id].messages;
                const container = document.getElementById('chatContainer');
                container.innerHTML = '';
                document.getElementById('suggestionsBox').style.display = 'none';
                
                currentChatMessages.forEach(msg => {
                    if (msg.role === 'user') {
                        container.innerHTML += `<div class="message user-message">${parseMarkdown(msg.content)}</div>`;
                    } else {
                        container.innerHTML += `<div class="bot-wrapper"><div class="bot-avatar">🍏</div><div class="message bot-message">${parseMarkdown(msg.content)}</div></div>`;
                    }
                });
                container.scrollTop = container.scrollHeight;
                toggleSidebar();
            }
        }

        // === 4. محرك الإرسال والـ API ===
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            if (!currentChatId) currentChatId = Date.now().toString();

            const selectedDomain = document.getElementById('domainSelect').value;
            
            // إضافة للواجهة والمصفوفة
            currentChatMessages.push({ role: 'user', content: message });
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML += `<div class="message user-message">${parseMarkdown(message)}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            inputField.value = '';
            document.getElementById('suggestionsBox').style.display = 'none';
            document.getElementById('loadingIndicator').style.display = 'block';

            let languageEnforcement = currentLang === 'en' ? "\n[System Strict Rule: Reply ONLY in English.]" : "\n[System Strict Rule: Reply ONLY in Arabic.]";

            try {
                const response = await fetch('https://nutrimind-red.vercel.app/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_message: message + languageEnforcement, domain: selectedDomain })
                });

                if (!response.ok) throw new Error('Network Error');
                const data = await response.json();
                
                currentChatMessages.push({ role: 'bot', content: data.reply });
                chatContainer.innerHTML += `<div class="bot-wrapper"><div class="bot-avatar">🍏</div><div class="message bot-message">${parseMarkdown(data.reply)}</div></div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                saveChatToLocal(); // حفظ بعد كل رد
            } catch (error) {
                chatContainer.innerHTML += `<div class="bot-wrapper"><div class="bot-avatar">🍏</div><div class="message bot-message">${uiText[currentLang].errorMsg}</div></div>`;
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }
        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        // === 5. إصلاح جودة الـ PDF (High-Contrast Trick) ===
        function downloadPDF() {
            const element = document.getElementById('chatContainer');
            if (element.children.length === 0) return;

            // الخدعة: إضافة كلاس يفرض ألوان واضحة جداً للطباعة
            element.classList.add('pdf-export-mode');

            const opt = {
                margin:       10,
                filename:     'Nutri_Consultation.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                // إزالة الخدعة وعودة الألوان لطبيعتها بعد التحميل
                element.classList.remove('pdf-export-mode');
            });
        }

        // التشغيل الأولي
        initDomains(); rotateSuggestions(); renderHistoryList();
    </script>
</body>
</html>
