<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Nutri - AI Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme Defaults */
            --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #f4fdf8 40%, #d1fae5 100%);
            --text-color: #0f172a;
            --sub-text: #475569;
            --btn-bg: #ffffff;
            --btn-border: #a7f3d0;
            --user-bg: #dcf8c6;
            --user-text: #111b21;
            --bot-bg: #ffffff;
            --bot-text: #111b21;
        }

        [data-theme="dark"] {
            /* Dark Theme Overrides */
            --bg-gradient: radial-gradient(circle at center, #061c11 0%, #090a0f 60%, #050505 100%);
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --btn-bg: #0f172a;
            --btn-border: #166534;
            --user-bg: #005c4b;
            --user-text: #e9edef;
            --bot-bg: #202c33;
            --bot-text: #e9edef;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid var(--btn-border);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            max-width: 80%;
            margin-bottom: 20px;
            padding: 15px 20px;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            line-height: 1.6;
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: var(--user-bg);
            color: var(--user-text);
            margin-right: auto;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background-color: var(--bot-bg);
            color: var(--bot-text);
            margin-left: auto;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            outline: none;
        }

        button.send-btn {
            padding: 0 25px;
            background: #166534;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            font-size: 16px;
        }

        .loading { display: none; text-align: center; color: var(--sub-text); margin-bottom: 20px; }
    </style>
</head>
<body data-theme="light">

    <button class="theme-toggle" onclick="toggleTheme()">🌙 مظلم</button>

    <div class="header">
        <h1>🍏 Nutri - AI Advisor</h1>
        <p style="color: var(--sub-text); font-size: 14px; margin-top: 5px;">مستشارك الذكي في التغذية وتكنولوجيا الأغذية</p>
    </div>

    <div class="chat-container" id="chatContainer">
        <!-- Messages will appear here -->
    </div>
    
    <div class="loading" id="loadingIndicator">Nutri يحلل البيانات ويصيغ الرد... ⏳</div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اسأل Nutri عن أي استشارة غذائية..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // تغيير الثيم (Light / Dark)
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ ساطع';
            } else {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '🌙 مظلم';
            }
        }

        // إضافة رسالة للشاشة
        function appendMessage(content, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
            
            // تحويل الأسطر الجديدة إلى <br> لسهولة القراءة
            msgDiv.innerHTML = content.replace(/\n/g, '<br>');
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // التعامل مع زر الإدخال (Enter)
        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // إرسال الرسالة إلى FastAPI
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            inputField.value = '';
            
            const loading = document.getElementById('loadingIndicator');
            loading.style.display = 'block';

            try {
                // الاتصال بـ Backend السحابي الجديد على Vercel
                const response = await fetch('https://nutrimind-red.vercel.app/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_message: message, domain: "" })
                });

                if (!response.ok) throw new Error('خطأ في الاتصال بالخادم');
                
                const data = await response.json();
                appendMessage(data.reply, 'bot');
            } catch (error) {
                appendMessage("عذراً، حدث خطأ في الاتصال بالخادم. يرجى المحاولة لاحقاً.", 'bot');
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
