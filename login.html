<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri - تسجيل الدخول</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍏</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #dcf8c6 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; backdrop-filter: blur(10px); }
        .auth-box h1 { color: #0f172a; margin-bottom: 10px; font-weight: 800; font-size: 28px;}
        .auth-box p { color: #475569; margin-bottom: 25px; font-size: 14px;}
        input { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #cbd5e1; box-sizing: border-box; font-family: 'Cairo', sans-serif; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }
        .btn-group { display: flex; gap: 10px; margin-bottom: 12px; }
        button { flex: 1; padding: 15px; border-radius: 10px; border: none; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .btn-main { background: #166534; color: white; }
        .btn-main:hover { background: #14532d; transform: translateY(-2px); }
        .btn-outline { background: transparent; color: #0f172a; border: 2px solid #166534; }
        .btn-outline:hover { background: rgba(22, 101, 52, 0.1); }
        .btn-guest { width: 100%; background: transparent; color: #0f172a; border: 2px solid #059669; }
        .btn-guest:hover { background: rgba(5, 150, 105, 0.1); transform: translateY(-2px); }
        #msg { margin-top: 15px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-box">
        <div style="font-size: 60px; margin-bottom: 15px;">🍏</div>
        <h1>Nutri AI</h1>
        <p>مستشارك الغذائي الذكي</p>
        
        <input type="email" id="email" placeholder="البريد الإلكتروني...">
        <input type="password" id="password" placeholder="كلمة المرور...">
        
        <div class="btn-group">
            <button class="btn-main" onclick="login()">دخول</button>
            <button class="btn-outline" onclick="signup()">حساب جديد</button>
        </div>
        <button class="btn-guest" onclick="guest()">متابعة كضيف (10 رسائل)</button>
        
        <div id="msg"></div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://pvtebagqtykzhtcjodwk.supabase.co', 'sb_publishable_-kJ7ZqobsqGIAdGfa469tw_MXl2y6hS');
        const msgBox = document.getElementById('msg');

        // فحص سريع: إذا كان المستخدم مسجلاً، انقله فوراً للشات
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'index.html';
        });

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) { showMsg('أدخل البيانات.', '#ef4444'); return; }
            
            showMsg('جاري الدخول...', '#059669');
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) showMsg(error.message, '#ef4444');
            else { localStorage.removeItem('nutri_guest'); window.location.href = 'index.html'; }
        }

        async function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) { showMsg('أدخل البيانات.', '#ef4444'); return; }
            
            showMsg('جاري إنشاء الحساب...', '#059669');
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) showMsg(error.message, '#ef4444');
            else { localStorage.removeItem('nutri_guest'); window.location.href = 'index.html'; }
        }

        function guest() {
            localStorage.setItem('nutri_guest', 'true');
            window.location.href = 'index.html';
        }

        function showMsg(text, color) {
            msgBox.style.color = color;
            msgBox.textContent = text;
        }
    </script>
</body>
</html>
